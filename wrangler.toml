name = "google-news-feed"
main = "src/worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ---- Live feed cron: rebuild the cached feed every 2 minutes ----
[triggers]
crons = ["*/2 * * * *"]

# ---- R2: stores the rendered live feed + (optionally) archive zips for download links ----
[[r2_buckets]]
binding = "FEED_BUCKET"
bucket_name = "google-news-feed"

# ---- Non-secret config (secrets go via `wrangler secret put`) ----
[vars]
# Static channel metadata
CHANNEL_TITLE = "Local News Now"
CHANNEL_DESCRIPTION = "Licensed news content from ARLnow, ALXnow and FFXnow."
# Channel <link> — the publisher's website (RSS 2.0), NOT the feed's own URL.
CHANNEL_LINK = "https://lnn.co"
# Publisher logo for the channel-level <image> (Google's branding request). Served
# by this Worker from the bundled assets/lnn-logo.png, cached hard at the edge —
# so the ?v= is a cache-buster: BUMP IT whenever assets/lnn-logo.png changes, or
# consumers keep the previous image for up to max-age (24h).
CHANNEL_IMAGE_URL = "https://google-news-feed.local-news-now-group.workers.dev/logo.png?v=512"
# Rolling window for the live feed (days). 3 comfortably covers Google's "last 2 days".
WINDOW_DAYS = "3"
# How long a checked "Delete from Google Feed" record keeps emitting a tombstone (days).
TOMBSTONE_DAYS = "14"

# ---- Publish poller (WordPress REST -> same Zapier webhook), replaces the WP plugin ----
# Off by default so deploying the code is inert. The Zapier catch-hook URL is a
# SECRET: `wrangler secret put INGEST_WEBHOOK_URL`.
WP_POLL_ENABLED = "false"
# When enabled: "true" = detect + log new posts but DON'T POST the webhook (safe dry-run).
WP_DRY_RUN = "false"
# Updated-article poller. Fires a SEPARATE hook (secret UPDATE_WEBHOOK_URL) when an
# article's *content* changes. Gated on WP_POLL_ENABLED too, since it shares the
# per-site state. Zapier writes an article summary back into WP meta after every
# publish/update, which bumps post_modified — the content-hash gate is what stops
# that becoming an infinite loop. See CLAUDE.md before touching it.
WP_UPDATE_POLL_ENABLED = "false"

# ---- Custom domain for the feed (optional but recommended) ----
# Uncomment after adding feeds.lnn.co to this Cloudflare account. Otherwise the
# worker is reachable at https://google-news-feed.<your-subdomain>.workers.dev
# [[routes]]
# pattern = "feeds.lnn.co/*"
# custom_domain = true

# ---- R2 lifecycle note ----
# Add a lifecycle rule on the bucket to expire `archive/` objects after ~30 days
# so old quarterly zips clean themselves up (download links are short-lived anyway).
